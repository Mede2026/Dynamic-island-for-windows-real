# Tests + installateur Windows (.msi / .exe) à chaque envoi sur GitHub.
# Une étiquette « v… » (ex. v0.1.0) publie en plus une Release avec l'installateur.
name: Windows

on:
  push:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  tests:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx tsc --noEmit
      - run: npm test
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - run: pip install -r tools/requirements.txt
      - run: python -m pytest tools/tests -q

  installateur:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
      - uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
      - run: npm ci
      - run: cargo test --manifest-path src-tauri/Cargo.toml
      - run: npx tauri build
      - uses: actions/upload-artifact@v6
        with:
          name: installateur-windows
          path: |
            src-tauri/target/release/bundle/msi/*.msi
            src-tauri/target/release/bundle/nsis/*.exe
      - name: Publier la Release (étiquette v…)
        if: startsWith(github.ref, 'refs/tags/v')
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" \
            src-tauri/target/release/bundle/msi/*.msi \
            src-tauri/target/release/bundle/nsis/*.exe \
            --title "Dynamic Island for Windows $GITHUB_REF_NAME" \
            --notes-file .github/notes-de-version.md
