# Tests + installateur Windows (.msi / .exe) à chaque envoi sur GitHub.
# Release : onglet Actions → Windows → « Run workflow » avec une version (ex. v0.1.0),
# ou envoi d'une étiquette « v… ». L'installateur est alors publié dans une Release.
name: Windows

on:
  push:
  workflow_dispatch:
    inputs:
      version:
        description: "Version à publier en Release (ex. v0.1.0) ; vide = simple compilation"
        required: false
        default: ""

permissions:
  contents: write

jobs:
  tests:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx tsc --noEmit
      - run: npm test
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - run: pip install -r tools/requirements.txt
      - run: python -m pytest tools/tests -q

  installateur:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
      - uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
      - run: npm ci
      - run: cargo test --manifest-path src-tauri/Cargo.toml
      - run: npx tauri build
      - name: Essai de démarrage (l'île doit tourner 20 s sans planter)
        shell: pwsh
        run: |
          $exe = (Resolve-Path src-tauri/target/release/dynamic-island.exe).Path
          $p = Start-Process $exe -PassThru
          Start-Sleep -Seconds 20
          $journal = "$env:APPDATA\com.mederic.dynamicisland\journal.txt"
          Write-Host "----- journal.txt -----"
          if (Test-Path $journal) { Get-Content $journal } else { Write-Host "(pas de journal)" }
          Write-Host "-----------------------"
          $plantage = (Test-Path $journal) -and (Select-String -Path $journal -Pattern "Plantage" -Quiet)
          if ($p.HasExited) { Write-Host "PLANTAGE : l'île s'est fermée (code $($p.ExitCode))"; exit 1 }
          Stop-Process -Id $p.Id -Force
          if ($plantage) { Write-Host "PLANTAGE signalé dans le journal"; exit 1 }
          Write-Host "OK : l'île tourne encore après 20 s"
      - uses: actions/upload-artifact@v6
        with:
          name: installateur-windows
          path: |
            src-tauri/target/release/bundle/msi/*.msi
            src-tauri/target/release/bundle/nsis/*.exe
      - name: Publier la Release
        if: startsWith(github.ref, 'refs/tags/v') || inputs.version != ''
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ inputs.version || github.ref_name }}
        run: |
          gh release create "$VERSION" --target "$GITHUB_SHA" \
            src-tauri/target/release/bundle/msi/*.msi \
            src-tauri/target/release/bundle/nsis/*.exe \
            --title "Dynamic Island for Windows $VERSION" \
            --notes-file .github/notes-de-version.md
